services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travexa
      POSTGRES_USER: travexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - travexa-postgres:/var/lib/postgresql/data

volumes:
  travexa-postgres:
